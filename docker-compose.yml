services:
  php-fpm:
    build:
      context: ./docker/php
    container_name: nacionalmc_php
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html/view
    env_file:
      - .env
    depends_on:
      - mysql                 # <-- Añadido, para que PHP espere a MySQL
    networks:
      - nacionalmc-network

  nginx:
    image: nginx:1.25.2
    container_name: nacionalmc_nginx
    depends_on:
      - php-fpm
      - mysql                 # <-- Añadido, para que nginx espere a PHP y MySQL
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "5000:80"
    networks:
      - nacionalmc-network

  mysql:
    image: mysql:8.0
    container_name: nacionalmc_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./model/nacional.sql:/docker-entrypoint-initdb.d/nacional.sql:ro
    ports:
      - "3307:3306"
    networks:
      - nacionalmc-network

volumes:
  mysql_data:

networks:
  nacionalmc-network:
    name: nacionalmc-network
    driver: bridge
